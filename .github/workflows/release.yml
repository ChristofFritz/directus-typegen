# Publishes to npm via trusted publishing (OIDC): no npm token is stored anywhere.
# One-time setup on npmjs.com: package settings -> Trusted Publishers -> GitHub Actions,
# repository ChristofFritz/directus-typegen, workflow file release.yml.
name: Release

on:
  release:
    types: [published]
  workflow_dispatch: # re-run a release manually, e.g. after a failed publish

permissions:
  contents: read
  id-token: write # required for npm trusted publishing + provenance

jobs:
  publish:
    runs-on: ubuntu-latest
    environment: npm
    services:
      directus:
        image: directus/directus:12.3.1
        ports:
          - 8055:8055
        env:
          KEY: test-key
          SECRET: test-secret
          ADMIN_EMAIL: admin@example.com
          ADMIN_PASSWORD: admin123
          ADMIN_TOKEN: test-static-token
          DB_CLIENT: sqlite3
          DB_FILENAME: /directus/database/data.db
          WEBSOCKETS_ENABLED: "false"
          TELEMETRY: "false"
        options: >-
          --health-cmd "wget -qO- http://127.0.0.1:8055/server/ping || exit 1"
          --health-interval 3s
          --health-timeout 5s
          --health-retries 40
          --health-start-period 15s
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          # No registry-url: it would inject a placeholder NODE_AUTH_TOKEN and npm
          # would use that instead of the OIDC token from trusted publishing.
          cache: npm
      - run: npm ci
      # npm >= 11.5.1 is needed for trusted publishing; Node 24 ships npm 11.
      - run: npm --version
      - name: Show OIDC token claims (no secret material)
        run: |
          curl -sS -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=npm:registry.npmjs.org" \
          | node -e '
            const t = JSON.parse(require("fs").readFileSync(0, "utf8")).value;
            const c = JSON.parse(Buffer.from(t.split(".")[1], "base64url").toString());
            for (const k of ["repository","repository_owner","workflow_ref","job_workflow_ref","environment","ref","event_name","aud"]) console.log(k + "=" + c[k]);
          '
      - run: npm publish --loglevel verbose
        env:
          DIRECTUS_TEST_HOST: http://localhost:8055
          DIRECTUS_TEST_TOKEN: test-static-token
          DIRECTUS_TEST_EMAIL: admin@example.com
          DIRECTUS_TEST_PASSWORD: admin123
          DIRECTUS_TEST_VERSION: 12.3.1
